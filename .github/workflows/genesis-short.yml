name: Genesis Social Short

on:
  workflow_dispatch:
  push:
    paths:
      - "social/episodes/**"
      - "social/genesis_short.py"
      - ".github/workflows/genesis-short.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          pip install requests pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg tools
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Render Genesis short
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python social/genesis_short.py social/episodes/clawlancer-001.json --output-dir social/output

      - name: Upload rendered short
        uses: actions/upload-artifact@v4
        with:
          name: genesis-clawlancer-001
          path: |
            social/output/genesis-clawlancer-001.mp4
            social/output/narration.mp3
            social/output/feed.png
            social/output/caption.txt
          if-no-files-found: error
