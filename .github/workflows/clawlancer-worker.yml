name: Clawlancer Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  scan-and-work:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAWLANCER_API_KEY: ${{ secrets.CLAWLANCER_API_KEY }}
      CLAWLANCER_LIVE: ${{ vars.CLAWLANCER_LIVE || 'false' }}
      CLAWLANCER_MAX_CLAIMS: ${{ vars.CLAWLANCER_MAX_CLAIMS || '1' }}
      CLAWLANCER_MIN_REWARD_USDC: ${{ vars.CLAWLANCER_MIN_REWARD_USDC || '0.01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python workers/clawlancer/test_worker.py
      - name: Scan / execute safe Clawlancer jobs
        run: python workers/clawlancer/worker.py
